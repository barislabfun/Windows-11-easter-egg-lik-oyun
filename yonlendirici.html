<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyorsunuz...</title>
    <!-- Otomatik Yönlendirme (3 saniye sonra) -->
    <meta http-equiv="refresh" content="3;url=https://github.com/barislabfun/Windows-11-easter-egg-lik-oyun/releases">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0078d4, #002050);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 400px;
        }
        h2 {
            margin-bottom: 15px;
            font-weight: 600;
        }
        p {
            font-size: 15px;
            color: #e0e0e0;
            margin-bottom: 25px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        a {
            color: #60cdff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
            }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Yönlendiriliyorsunuz</h2>
        <p>Windows 11 Easter Egg'lik Oyun sürüm sayfasına aktarılıyorsunuz. Birkaç saniye içinde yönlendirileceksiniz...</p>
        <p>Eğer otomatik olarak yönlendirilmezseniz, lütfen <a href="https://github.com/barislabfun/Windows-11-easter-egg-lik-oyun/releases">buraya tıklayın</a>.</p>
    </div>
</body>
</html>
